<!--삭제 기능 부분 템플릿-->
<dialog id="delete-dialog" class="delete-dialog">
    <form method="dialog">
        <h3>게시글 삭제</h3>
        <p>삭제 후에는 복구할 수 없습니다.</p>
        <p class="delete-dialog-hint">등록할 때 설정한 숫자 4자리 비밀번호를 입력해 주세요.</p>

        <!--비밀번호를 확인할 게시글의 id와 유형-->
        <input id="delete-item-id" name="id" type="hidden">
        <input id="delete-item-type" name="type" type="hidden">

        <label for="delete-password">삭제 비밀번호</label>
        <input id="delete-password" name="password" type="password" maxlength="4" placeholder="숫자 4자리">

        <div class="delete-dialog-buttons">
            <button type="submit" value="cancel" class="delete-cancel-button">취소</button>
            <button type="submit" value="confirm" class="delete-confirm-button" formmethod="post" formaction="{{ url_for('delete.delete') }}">삭제 확인</button>
        </div>
    </form>
</dialog>

<!--삭제 확인 버튼 클릭 후 실제 삭제 전 한 번 더 묻는 dialog-->
<dialog id="delete-confirm-dialog" class="delete-dialog">
    <p>이 게시글을 삭제하겠습니까?</p>
    <div class="delete-dialog-buttons">
        <button type="button" id="delete-confirm-cancel" class="delete-cancel-button">취소</button>
        <button type="button" id="delete-final-button" class="delete-confirm-button">삭제하기</button>
    </div>
</dialog>
